<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Baton Core and domain orchestration Plugins</title>
  <desc id="desc">Baton Core is the collaboration platform for humans, Harnesses, and Plugins. Each business domain is delivered as one Plugin. The detailed Plugin observes and acts through a Connector, asks humans with ask(question), and requests Harness work with harness(prompt).</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      text {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        fill: #111827;
      }
      .actor {
        stroke: #111827;
        stroke-width: 2.5;
        filter: url(#shadow);
      }
      .actor-title {
        font-size: 28px;
        font-weight: 700;
        text-anchor: middle;
      }
      .actor-detail {
        font-size: 17px;
        fill: #4b5563;
        text-anchor: middle;
      }
      .port-line {
        stroke: #374151;
        stroke-width: 3;
        marker-start: url(#arrow-start);
        marker-end: url(#arrow);
      }
      .port-pill {
        fill: #ffffff;
        stroke: #9ca3af;
        stroke-width: 1.5;
      }
      .port-label {
        font-size: 16px;
        font-weight: 650;
        text-anchor: middle;
      }
      .plugin-card {
        fill: #ffffff;
        stroke: #3f7650;
        stroke-width: 2;
      }
      .plugin-loop {
        fill: #edf8f0;
        stroke: #8bb498;
        stroke-width: 1.5;
      }
      .plugin-flow {
        fill: none;
        stroke: #3f7650;
        stroke-width: 2.2;
        marker-end: url(#arrow);
      }
      .action-pill {
        fill: #fff7da;
        stroke: #b28b24;
        stroke-width: 1.5;
      }
      .primitive {
        fill: #ffffff;
        stroke: #6080b8;
        stroke-width: 2;
      }
      .primitive-label {
        font-size: 19px;
        font-weight: 650;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="1800" height="900" fill="#fbfcfe"/>

  <text x="70" y="54" font-size="34" font-weight="750">Baton v3</text>
  <text x="70" y="86" font-size="18" fill="#6b7280">A collaboration core with domain orchestration delivered as Plugins.</text>

  <!-- A Plugin is one domain's orchestration implementation, installed on the shared Core. -->
  <rect x="350" y="115" width="1030" height="255" rx="26" fill="#e7f5eb" stroke="#3f7650" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="385" y="156" font-size="25" font-weight="720">Baton Plugins · Domain orchestration layer</text>
  <text x="1345" y="156" font-size="17" fill="#3f7650" font-weight="650" text-anchor="end">one biz domain = one Plugin</text>

  <rect class="plugin-card" x="385" y="180" width="320" height="145" rx="18"/>
  <text class="actor-title" x="545" y="222">Plugin 1 · Biz A</text>
  <text class="actor-detail" x="545" y="252">owns its domain control loop</text>
  <rect class="plugin-loop" x="410" y="274" width="270" height="34" rx="17"/>
  <text x="545" y="297" font-size="13" font-weight="650" text-anchor="middle">Resource · reconcile · Connector</text>

  <!-- One Plugin is expanded to show its domain loop and Core verbs. -->
  <rect class="plugin-card" x="730" y="165" width="615" height="170" rx="18"/>
  <text class="actor-title" x="1037" y="205">Plugin 2 · Biz B</text>

  <rect class="plugin-loop" x="760" y="225" width="180" height="34" rx="17"/>
  <text x="850" y="248" font-size="14" font-weight="650" text-anchor="middle">Resource · spec/status</text>
  <line class="plugin-flow" x1="945" y1="242" x2="967" y2="242"/>

  <rect class="plugin-loop" x="975" y="225" width="125" height="34" rx="17"/>
  <text x="1037" y="248" font-size="14" font-weight="650" text-anchor="middle">reconcile</text>
  <line class="plugin-flow" x1="1105" y1="242" x2="1127" y2="242"/>

  <rect class="plugin-loop" x="1135" y="225" width="180" height="34" rx="17"/>
  <text x="1225" y="248" font-size="14" font-weight="650" text-anchor="middle">Connector</text>

  <text x="765" y="293" font-size="14" fill="#4b5563">Core verbs</text>
  <rect class="action-pill" x="860" y="272" width="160" height="34" rx="17"/>
  <text x="940" y="295" font-size="14" font-weight="650" text-anchor="middle">ask(question)</text>
  <rect class="action-pill" x="1040" y="272" width="200" height="34" rx="17"/>
  <text x="1140" y="295" font-size="14" font-weight="650" text-anchor="middle">harness(prompt)</text>
  <line class="plugin-flow" x1="1017" y1="260" x2="940" y2="269"/>
  <line class="plugin-flow" x1="1057" y1="260" x2="1140" y2="269"/>
  <text x="1037" y="326" font-size="13" fill="#4b5563" text-anchor="middle">observe → measure diff → act → update status</text>

  <!-- Connector observes and acts on the Plugin's domain system directly. -->
  <line class="port-line" x1="1319" y1="242" x2="1475" y2="242"/>
  <text x="1400" y="222" font-size="14" fill="#4b5563" font-weight="650" text-anchor="middle">observe · act</text>
  <rect class="actor" x="1485" y="202" width="245" height="80" rx="40" fill="#eee7ff"/>
  <text x="1607" y="235" font-size="20" font-weight="700" text-anchor="middle">External</text>
  <text x="1607" y="261" font-size="16" fill="#4b5563" text-anchor="middle">domain system</text>

  <text x="900" y="357" font-size="15" fill="#4b5563" text-anchor="middle">Marketplace packages, installs, and upgrades each domain loop independently.</text>

  <!-- Every Plugin uses the same stable Core contract. -->
  <line class="port-line" x1="545" y1="374" x2="545" y2="450"/>
  <rect class="port-pill" x="433" y="390" width="224" height="38" rx="19"/>
  <text class="port-label" x="545" y="415">ReconcileContext · result</text>

  <line class="port-line" x1="1037" y1="374" x2="1037" y2="450"/>
  <rect class="port-pill" x="925" y="390" width="224" height="38" rx="19"/>
  <text class="port-label" x="1037" y="415">ReconcileContext · result</text>

  <!-- Core owns collaboration objects and lifecycles, not domain semantics. -->
  <rect x="420" y="450" width="960" height="350" rx="28" fill="#edf3fc" stroke="#111827" stroke-width="3" filter="url(#shadow)"/>
  <text x="900" y="505" font-size="31" font-weight="750" text-anchor="middle">Baton Core · Collaboration Platform</text>
  <text x="900" y="537" font-size="18" fill="#4b5563" text-anchor="middle">Human · Harness · Plugins coordinate through typed, durable facts</text>

  <rect class="primitive" x="475" y="575" width="170" height="68" rx="16"/>
  <text class="primitive-label" x="560" y="616">Input</text>

  <rect class="primitive" x="665" y="575" width="185" height="68" rx="16"/>
  <text class="primitive-label" x="757" y="616">Interaction</text>

  <rect class="primitive" x="870" y="575" width="250" height="68" rx="16"/>
  <text class="primitive-label" x="995" y="616">HarnessInvocation</text>

  <rect class="primitive" x="1140" y="575" width="170" height="68" rx="16"/>
  <text class="primitive-label" x="1225" y="616">Event</text>

  <rect x="475" y="686" width="835" height="68" rx="17" fill="#dce8f8" stroke="#6080b8" stroke-width="2"/>
  <text x="892" y="714" font-size="17" fill="#4b5563" text-anchor="middle">durable collaboration history</text>
  <text x="892" y="741" font-size="20" font-weight="700" text-anchor="middle">BatonSession · Lane · Event Ledger</text>

  <!-- Human and Harness are capability-owning participants connected through Core. -->
  <rect class="actor" x="55" y="525" width="285" height="145" rx="22" fill="#eef3fb"/>
  <text class="actor-title" x="197" y="578">Human</text>
  <text class="actor-detail" x="197" y="614">intent · prompt · decision</text>

  <rect class="actor" x="1460" y="525" width="285" height="145" rx="22" fill="#fff3cf"/>
  <text class="actor-title" x="1602" y="578">Harness</text>
  <text class="actor-detail" x="1602" y="614">model · tools · sandbox</text>

  <line class="port-line" x1="344" y1="545" x2="416" y2="545"/>
  <rect class="port-pill" x="280" y="493" width="200" height="38" rx="19"/>
  <text class="port-label" x="380" y="518">Input · Interaction</text>

  <line class="port-line" x1="1384" y1="545" x2="1456" y2="545"/>
  <rect class="port-pill" x="1324" y="493" width="192" height="38" rx="19"/>
  <text class="port-label" x="1420" y="518">Turn · Event</text>

  <text x="900" y="858" font-size="18" fill="#6b7280" text-anchor="middle">Core owns collaboration; each Plugin owns one biz domain and its control loop.</text>
</svg>
