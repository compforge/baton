<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Baton Core and domain orchestration Plugins</title>
  <desc id="desc">Baton Core is the collaboration platform for humans, Harnesses, and Plugins. Each business domain is delivered as one Plugin with its own Resource, reconcile loop, and Connector.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      text {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        fill: #111827;
      }
      .actor {
        stroke: #111827;
        stroke-width: 2.5;
        filter: url(#shadow);
      }
      .actor-title {
        font-size: 28px;
        font-weight: 700;
        text-anchor: middle;
      }
      .actor-detail {
        font-size: 17px;
        fill: #4b5563;
        text-anchor: middle;
      }
      .port-line {
        stroke: #374151;
        stroke-width: 3;
        marker-start: url(#arrow-start);
        marker-end: url(#arrow);
      }
      .port-pill {
        fill: #ffffff;
        stroke: #9ca3af;
        stroke-width: 1.5;
      }
      .port-label {
        font-size: 16px;
        font-weight: 650;
        text-anchor: middle;
      }
      .plugin-card {
        fill: #ffffff;
        stroke: #3f7650;
        stroke-width: 2;
      }
      .plugin-loop {
        fill: #edf8f0;
        stroke: #8bb498;
        stroke-width: 1.5;
      }
      .primitive {
        fill: #ffffff;
        stroke: #6080b8;
        stroke-width: 2;
      }
      .primitive-label {
        font-size: 19px;
        font-weight: 650;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="1800" height="900" fill="#fbfcfe"/>

  <text x="70" y="54" font-size="34" font-weight="750">Baton v3</text>
  <text x="70" y="86" font-size="18" fill="#6b7280">A collaboration core with domain orchestration delivered as Plugins.</text>

  <!-- A Plugin is one domain's orchestration implementation, installed on the shared Core. -->
  <rect x="420" y="115" width="960" height="245" rx="26" fill="#e7f5eb" stroke="#3f7650" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="455" y="156" font-size="25" font-weight="720">Baton Plugins · Domain orchestration layer</text>
  <text x="1345" y="156" font-size="17" fill="#3f7650" font-weight="650" text-anchor="end">one biz domain = one Plugin</text>

  <rect class="plugin-card" x="455" y="180" width="425" height="135" rx="18"/>
  <text class="actor-title" x="667" y="220">Plugin 1 · Biz A</text>
  <text class="actor-detail" x="667" y="249">owns goal · observations · completion</text>
  <rect class="plugin-loop" x="480" y="268" width="375" height="34" rx="17"/>
  <text x="667" y="291" font-size="15" font-weight="650" text-anchor="middle">Resource (spec/status) → reconcile → Connector</text>

  <rect class="plugin-card" x="920" y="180" width="425" height="135" rx="18"/>
  <text class="actor-title" x="1132" y="220">Plugin 2 · Biz B</text>
  <text class="actor-detail" x="1132" y="249">owns goal · observations · completion</text>
  <rect class="plugin-loop" x="945" y="268" width="375" height="34" rx="17"/>
  <text x="1132" y="291" font-size="15" font-weight="650" text-anchor="middle">Resource (spec/status) → reconcile → Connector</text>

  <text x="900" y="342" font-size="15" fill="#4b5563" text-anchor="middle">Marketplace packages, installs, and upgrades each domain loop independently.</text>

  <!-- Every Plugin uses the same stable Core contract. -->
  <line class="port-line" x1="667" y1="364" x2="667" y2="450"/>
  <rect class="port-pill" x="555" y="380" width="224" height="38" rx="19"/>
  <text class="port-label" x="667" y="405">ReconcileContext · result</text>

  <line class="port-line" x1="1132" y1="364" x2="1132" y2="450"/>
  <rect class="port-pill" x="1020" y="380" width="224" height="38" rx="19"/>
  <text class="port-label" x="1132" y="405">ReconcileContext · result</text>

  <!-- Core owns collaboration objects and lifecycles, not domain semantics. -->
  <rect x="420" y="450" width="960" height="350" rx="28" fill="#edf3fc" stroke="#111827" stroke-width="3" filter="url(#shadow)"/>
  <text x="900" y="505" font-size="31" font-weight="750" text-anchor="middle">Baton Core · Collaboration Platform</text>
  <text x="900" y="537" font-size="18" fill="#4b5563" text-anchor="middle">Human · Harness · Plugins coordinate through typed, durable facts</text>

  <rect class="primitive" x="475" y="575" width="170" height="68" rx="16"/>
  <text class="primitive-label" x="560" y="616">Input</text>

  <rect class="primitive" x="665" y="575" width="185" height="68" rx="16"/>
  <text class="primitive-label" x="757" y="616">Interaction</text>

  <rect class="primitive" x="870" y="575" width="250" height="68" rx="16"/>
  <text class="primitive-label" x="995" y="616">HarnessInvocation</text>

  <rect class="primitive" x="1140" y="575" width="170" height="68" rx="16"/>
  <text class="primitive-label" x="1225" y="616">Event</text>

  <rect x="475" y="686" width="835" height="68" rx="17" fill="#dce8f8" stroke="#6080b8" stroke-width="2"/>
  <text x="892" y="714" font-size="17" fill="#4b5563" text-anchor="middle">durable collaboration history</text>
  <text x="892" y="741" font-size="20" font-weight="700" text-anchor="middle">BatonSession · Lane · Event Ledger</text>

  <!-- Human and Harness are capability-owning participants connected through Core. -->
  <rect class="actor" x="55" y="525" width="285" height="145" rx="22" fill="#eef3fb"/>
  <text class="actor-title" x="197" y="578">Human</text>
  <text class="actor-detail" x="197" y="614">intent · prompt · decision</text>

  <rect class="actor" x="1460" y="525" width="285" height="145" rx="22" fill="#fff3cf"/>
  <text class="actor-title" x="1602" y="578">Harness</text>
  <text class="actor-detail" x="1602" y="614">model · tools · sandbox</text>

  <line class="port-line" x1="344" y1="545" x2="416" y2="545"/>
  <rect class="port-pill" x="280" y="493" width="200" height="38" rx="19"/>
  <text class="port-label" x="380" y="518">Input · Interaction</text>

  <line class="port-line" x1="1384" y1="545" x2="1456" y2="545"/>
  <rect class="port-pill" x="1324" y="493" width="192" height="38" rx="19"/>
  <text class="port-label" x="1420" y="518">Turn · Event</text>

  <text x="900" y="858" font-size="18" fill="#6b7280" text-anchor="middle">Core owns collaboration; each Plugin owns one biz domain and its control loop.</text>
</svg>
